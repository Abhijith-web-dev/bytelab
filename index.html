    <!-- Inline Ultra-Lightweight Critical CSS Skeleton (renders in <50ms on 100kbps 2G connections) -->
    <style>
      :root {
        --app-bg: #ffffff;
        --app-text: #17171c;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: var(--app-bg);
        color: var(--app-text);
        -webkit-font-smoothing: antialiased;
      }
      .initial-skeleton-nav {
        height: 44px;
        background: #fafafc;
        border-bottom: 1px solid #e5e5e7;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
      }
      .initial-skeleton-brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        font-size: 14px;
        color: #17171c;
      }
      .initial-skeleton-body {
        max-width: 1140px;
        margin: 0 auto;
        padding: 40px 16px;
      }
      .initial-skeleton-hero {
        height: 180px;
        background: #f4f4f6;
        border-radius: 16px;
        margin-bottom: 24px;
        animation: pulse 1.5s ease-in-out infinite;
      }
      .initial-skeleton-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 16px;
      }
      .initial-skeleton-card {
        height: 140px;
        background: #f4f4f6;
        border-radius: 12px;
        animation: pulse 1.5s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
    </style>
